# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d450a43bd771e1dea848d30322a58c0f"
name = "winfluencer-app"
application_url = "https://winfluencer-shopify-app.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  # ── Lifecycle ──────────────────────────────────────────────────────────────
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # ── Orders (declarative — replaces runtime REST registration) ──────────────
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders"

  # ── GDPR (mandatory for App Store) ────────────────────────────────────────
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
scopes = "read_customer_events,read_orders,write_pixels,write_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://winfluencer-shopify-app.vercel.app/api/auth" ]

[app_proxy]
url = "https://winfluencer-shopify-app.vercel.app/api"
subpath = "winfluencer"
prefix = "apps"
